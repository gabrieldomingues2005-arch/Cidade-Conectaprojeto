name: Sincronizar site para gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "gh-pages-sync-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml

  sync:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Baixar branch main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar gh-pages com main
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A main avançou; esta execução não substituirá o preview."
            exit 0
          fi
          git push origin HEAD:refs/heads/gh-pages
