name: Validar Cidade Conecta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar JavaScript
        run: |
          node --check assets/runtime-config.js
          node --check assets/app.js
          node --check assets/piracicaba.js
          node --check assets/piracicaba-mapas.js
          node --check assets/privacy-geo.js
          node --check assets/site-enhancements.js

      - name: Validar base territorial e referências
        run: node scripts/validate-project.mjs

      - name: Validar JSON do manifesto
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest.webmanifest válido')"
