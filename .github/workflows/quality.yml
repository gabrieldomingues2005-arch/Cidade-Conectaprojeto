name: Validar Cidade Conecta

on:
  pull_request:
    branches: [main, feature/cidade-conecta-backend-recovery-20261022]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validar JavaScript
        run: |
          node --check assets/runtime-config.js
          node --check assets/auth.js
          node --check assets/supabase-bridge.js
          node --check assets/app.js
          node --check assets/institutional-a11y-v85.js
          node --check assets/piracicaba.js
          node --check assets/piracicaba-data.js
          node --check assets/piracicaba-mapas.js
          node --check assets/privacy-geo.js
          node --check assets/map-resilience.js
          node --check assets/site-enhancements.js
          node --check sw.js
          node --check scripts/validate-project.mjs
          node --check scripts/smoke-browser.mjs
          node --check scripts/test-auth.mjs
          node --check scripts/test-sw.mjs
          node --check scripts/test-edge.mjs
          node --check scripts/test-design.mjs
          node --check assets/civic-data.js
          node --check scripts/test-civic-data.mjs
          node --check assets/civic-ui.js
          node --check assets/civic-pages.js
          node --check assets/civic-share.js
          node --check assets/civic-community.js
          node --check assets/civic-admin.js
          node --check assets/civic-pwa.js
          node --check supabase/functions/community-actions/validation.mjs
          node --check scripts/test-community.mjs
          node --check scripts/test-civic-pages.mjs
          node --check scripts/test-pwa-assets.mjs
          node --check scripts/qa-backend-http.mjs
          node --check assets/civic-store.js
          node --check assets/civic-account.js
          node --check assets/civic-news-store.js
          node --check scripts/test-civic-store.mjs
          node --check scripts/test-civic-account.mjs
          node --check scripts/test-operational-edges.mjs
          node --check scripts/test-map-resilience.mjs
          node --check scripts/test-seo.mjs
          node --check scripts/validate-recovery.mjs

      - name: Validar smoke test de UI
        run: bash -n scripts/smoke-ui.sh

      - name: Testar autenticação, Edge e Service Worker
        run: node --test scripts/test-auth.mjs scripts/test-sw.mjs scripts/test-edge.mjs scripts/test-design.mjs scripts/test-civic-data.mjs scripts/test-civic-store.mjs scripts/test-civic-account.mjs scripts/test-civic-pages.mjs scripts/test-community.mjs scripts/test-operational-edges.mjs scripts/test-map-resilience.mjs scripts/test-seo.mjs scripts/test-pwa-assets.mjs

      - name: Verificar privacidade do cliente
        run: node scripts/qa-client-privacy.mjs

      - name: Validar base territorial e referências
        run: node scripts/validate-project.mjs

      - name: Validar recuperação do backend
        run: node scripts/validate-recovery.mjs

      - name: Validar JSON do manifesto
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest.webmanifest válido')"

      - name: Preparar referência de desempenho
        run: |
          git fetch --no-tags --depth=1 origin d031cb264d416f9c58119672f0aa28561b3ae317
          mkdir -p artifacts/baseline
          git archive d031cb264d416f9c58119672f0aa28561b3ae317 | tar -x -C artifacts/baseline

      - name: Smoke test UI em Chrome headless
        env:
          SMOKE_SCREENSHOT_DIR: artifacts/ui-smoke
        run: bash scripts/smoke-ui.sh


      - name: Montar backup Supabase pré-exclusão
        if: always()
        run: |
          rm -rf artifacts/supabase-predelete
          mkdir -p artifacts/supabase-predelete
          cp -R supabase/backup-20261022 artifacts/supabase-predelete/
          cp -R supabase/recovery artifacts/supabase-predelete/
          cp -R supabase/migrations artifacts/supabase-predelete/
          cp -R supabase/functions artifacts/supabase-predelete/
          cp schema.sql SUPABASE.md data/piracicaba.json artifacts/supabase-predelete/
          cp docs/BACKEND-RECOVERY-20261022.md artifacts/supabase-predelete/
          git rev-parse HEAD > artifacts/supabase-predelete/BACKUP_COMMIT.txt
          printf '%s\n' 'feature/cidade-conecta-backend-recovery-20261022' > artifacts/supabase-predelete/BACKUP_BRANCH.txt

      - name: Guardar backup Supabase pré-exclusão
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: supabase-predelete-backup
          path: artifacts/supabase-predelete
          if-no-files-found: error
          retention-days: 30

      - name: Montar pacote editável para Claude
        if: success()
        run: |
          rm -rf artifacts/claude-ui
          mkdir -p artifacts/claude-ui/assets artifacts/claude-ui/data artifacts/claude-ui/docs artifacts/claude-ui/scripts artifacts/claude-ui/screenshots
          cp index.html sw.js manifest.webmanifest favicon.svg README.md artifacts/claude-ui/
          cp assets/app.js assets/styles.css assets/design-v55.css assets/design-v56.css assets/design-system.css artifacts/claude-ui/assets/
          cp assets/institutional-pira-v85.css assets/institutional-a11y-v85.js artifacts/claude-ui/assets/
          cp assets/site-enhancements.js assets/site-enhancements.css artifacts/claude-ui/assets/
          cp assets/civic*.js assets/civic.css artifacts/claude-ui/assets/
          cp -R assets/vendor assets/icons artifacts/claude-ui/assets/
          cp assets/piracicaba.js assets/piracicaba.css assets/piracicaba-data.js artifacts/claude-ui/assets/
          cp assets/piracicaba-mapas.js assets/piracicaba-mapas.css assets/privacy-geo.js assets/map-resilience.js assets/seo-landing.css artifacts/claude-ui/assets/
          cp assets/supabase-bridge.js assets/auth.js assets/brand-mark-v51.svg artifacts/claude-ui/assets/
          cp data/piracicaba.json data/municipal-network.json artifacts/claude-ui/data/
          cp docs/UI-UX-V57.md docs/MAP-UX-V571.md docs/CLAUDE-UI-HANDOFF.md artifacts/claude-ui/docs/
          cp scripts/smoke-browser.mjs scripts/validate-project.mjs scripts/smoke-ui.sh artifacts/claude-ui/scripts/
          cp -R artifacts/ui-smoke/. artifacts/claude-ui/screenshots/
          cat > artifacts/claude-ui/assets/runtime-config.js <<'EOF'
          // Configuração sanitizada somente para revisão offline de UI.
          window.CIDADE_CONECTA_CONFIG = Object.freeze({
            appVersion: '5.7.1-claude-offline',
            city: 'Piracicaba',
            state: 'SP',
            municipalityIbgeCode: '3538709',
            dataMode: 'local',
            supabase: Object.freeze({
              enabled: false,
              projectRef: '',
              url: '',
              publishableKey: '',
              legacyAnonJwt: '',
              submitFunction: 'submit-occurrence',
              trackFunction: 'track-occurrence'
            })
          });
          EOF
          cat > artifacts/claude-ui/LEIA-PRIMEIRO.txt <<'EOF'
          Abra docs/CLAUDE-UI-HANDOFF.md antes de editar.
          Este pacote é uma cópia offline de UI. Não contém credenciais privadas.
          Edite somente frontend/layout conforme o handoff e devolva os arquivos alterados + CLAUDE-CHANGELOG.md.
          EOF

      - name: Guardar pacote editável para Claude
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: claude-ui-v571
          path: artifacts/claude-ui
          if-no-files-found: error
          retention-days: 7

      - name: Guardar capturas do smoke
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-smoke-screenshots
          path: artifacts/ui-smoke
          if-no-files-found: error
          retention-days: 7
