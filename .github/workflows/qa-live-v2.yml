name: QA live Supabase v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa-live-v2:
    if: github.head_ref == 'feature/cidade-conecta-backend-recovery-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validar navegador + Supabase v2 reais
        env:
          QA_SCREENSHOT_DIR: artifacts/qa-live-v2
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node scripts/qa-live-v2.mjs
      - name: Guardar evidências do QA live
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-live-v2-evidence
          path: artifacts/qa-live-v2
          if-no-files-found: warn
          retention-days: 7
